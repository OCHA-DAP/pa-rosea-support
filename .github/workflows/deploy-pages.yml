name: Deploy pages site to GitHub Pages

# Publishes the landing page (pages/) with the drought hotspot pages assembled under
# /ago/ and /zmb/, the Kenya flood triggers page under /ken/ and the Horn of Africa flood timing
# page under /hoa-flood-timing/. These are committed HTML (drought/<iso3>/<iso3>_hotspots.html,
# built by drought/hotspots/build_hotspots.py; flood/ken/ken_khf_trigger_review.html, built by
# flood/ken/build_review_page.py; flood/hoa/hoa_flood_timing.html, built by
# flood/hoa/build_page.py), so no secrets are needed here.
#
# Triggers: push to main touching the site files, or a manual run.
# Template: OCHA-DAP/ds-seas5-skill (itself from ds-geospatial-impact-estimates).

on:
  push:
    branches: [main]
    paths: ["pages/**", "drought/*/*_hotspots.html", "flood/ken/ken_khf_trigger_review.html", "flood/hoa/hoa_flood_timing.html", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (landing at /, pages at /ago/, /zmb/, /ken/ and /hoa-flood-timing/)
        run: |
          mkdir -p site
          rsync -a pages/ site/
          for iso in ago zmb; do
            mkdir -p "site/$iso"
            cp "drought/$iso/${iso}_hotspots.html" "site/$iso/index.html"
          done
          mkdir -p site/ken
          cp flood/ken/ken_khf_trigger_review.html site/ken/index.html
          mkdir -p site/hoa-flood-timing
          cp flood/hoa/hoa_flood_timing.html site/hoa-flood-timing/index.html
          test -f site/index.html && test -f site/assets/site.css
          test -f site/ago/index.html && test -f site/zmb/index.html && test -f site/ken/index.html
          test -f site/hoa-flood-timing/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
